name: Run Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpython:
    name: CPython tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --requirement requirements-dev.txt
    - name: Run CPython test suite
      env:
        PYTHONPATH: .
      run: python -m pytest -q tests

  client:
    name: App Server client tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --requirement requirements-dev.txt
    - name: Install Chromium
      run: python -m playwright install --with-deps chromium
    - name: Run App Server client suite
      env:
        PYTHONPATH: .
      run: >-
        python -m pytest -q client_tests/test_client.py
        --basetemp=client-test-artifacts
    - name: Upload client failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: reactive-client-test-diagnostics
        path: client-test-artifacts
        if-no-files-found: ignore
        retention-days: 7
